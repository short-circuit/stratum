[package]
name = "stratum-tauri"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Stratum PKM — Tauri desktop shell"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# tauri-build is required by build.rs (Tauri codegen) — cargo-machete can't see
# build-script usage, so it is whitelisted explicitly.
[package.metadata.cargo-machete]
ignored = ["tauri-build"]

[dependencies]
tauri = { version = "2", features = ["custom-protocol"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
chrono.workspace = true
uuid.workspace = true
log.workspace = true
tokio.workspace = true
tracing.workspace = true
base64.workspace = true
pkm-core = { path = "../crates/pkm-core" }
pkm-block = { path = "../crates/pkm-block" }
pkm-markdown = { path = "../crates/pkm-markdown" }
pkm-index = { path = "../crates/pkm-index" }
pkm-query = { path = "../crates/pkm-query" }
pkm-sync = { path = "../crates/pkm-sync" }
pkm-ai = { path = "../crates/pkm-ai" }
pkm-watcher = { path = "../crates/pkm-watcher" }
pkm-audio = { path = "../crates/pkm-audio" }
pkm-stt = { path = "../crates/pkm-stt" }
pkm-dictation = { path = "../crates/pkm-dictation" }
pkm-plugin = { path = "../crates/pkm-plugin" }
pulldown-cmark.workspace = true
reqwest.workspace = true
gix.workspace = true
dirs.workspace = true
tauri-plugin-android-fs = "28"

[dev-dependencies]
tempfile.workspace = true
uuid.workspace = true
chrono.workspace = true
# Integration tests for the plugin command layer use the Tauri mock test
# harness (`tauri::test`) plus a real in-process `wat`-compiled WASM module
# and wiremock where HTTP is involved.
tauri = { version = "2", features = ["test"] }
wat.workspace = true
wiremock = "0.6"
tokio.workspace = true
serde_json.workspace = true
