name: GPUI shell

# Native-shell gate: formatting, build, tests and clippy for crates/stratum-i18n,
# crates/stratum-ui and crates/stratum-editor on Linux, Windows and macOS, plus a
# rendered screenshot
# of the shell on Linux (the only runner in this workflow with a headless X
# server). Path-filtered so unrelated changes do not pay for the GPUI build,
# with a manual trigger for full-suite verification.

on:
  push:
    branches: [master]
    paths:
      - 'crates/stratum-i18n/**'
      - 'crates/stratum-ui/**'
      - 'crates/stratum-editor/**'
      - 'crates/stratum-mobile/**'
      - 'vendor/gpui-mobile/**'
      - 'scripts/capture-gpui-shell.sh'
      - 'scripts/capture-gpui-panels.sh'
      - 'scripts/capture-gpui-editor-perf.sh'
      - 'scripts/build-android.sh'
      - 'scripts/capture-gpui-mobile.sh'
      - '.github/workflows/gpui-ci.yml'
      - '.github/actions/install-linux-deps/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    branches: [master]
    paths:
      - 'crates/stratum-i18n/**'
      - 'crates/stratum-ui/**'
      - 'crates/stratum-editor/**'
      - 'crates/stratum-mobile/**'
      - 'vendor/gpui-mobile/**'
      - 'scripts/build-android.sh'
      - 'scripts/capture-gpui-mobile.sh'
      - 'scripts/capture-gpui-shell.sh'
      - 'scripts/capture-gpui-panels.sh'
      - 'scripts/capture-gpui-editor-perf.sh'
      - '.github/workflows/gpui-ci.yml'
      - '.github/actions/install-linux-deps/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gpui-shell:
    name: gpui shell (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt
          cache: false

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/install-linux-deps

      - name: Install frontend dependencies
        # stratum-app embeds node_modules/mermaid/dist/mermaid.min.js.
        run: npm ci

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Build GPUI crates
        run: cargo build -p stratum-i18n -p stratum-ui -p stratum-editor

      - name: Run GPUI tests
        run: cargo test -p stratum-i18n -p stratum-ui -p stratum-editor

      - name: Run GPUI clippy
        run: cargo clippy -p stratum-i18n -p stratum-ui -p stratum-editor --all-targets -- -D warnings

  gpui-capture:
    name: gpui shell screenshot (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Linux dependencies
        uses: ./.github/actions/install-linux-deps

      - name: Install capture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dri \
            mesa-vulkan-drivers \
            imagemagick \
            xdotool

      - name: Install frontend dependencies
        run: npm ci

      - name: Capture shell screenshot
        run: ./scripts/capture-gpui-shell.sh

      - name: Capture 10k editor performance
        run: ./scripts/capture-gpui-editor-perf.sh

      - name: Capture journal, page, search, query, ask, templates and flashcards panels
        run: ./scripts/capture-gpui-panels.sh

      - name: Capture the mobile layout at 1080x2400
        run: ./scripts/capture-gpui-mobile.sh

      - name: Upload screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: gpui-shell-screenshot
          path: |
            dist/gpui-shell.png
            dist/gpui-shell-collapsed.png
          if-no-files-found: error

      - name: Upload journal screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: gpui-journal-screenshots
          path: |
            dist/gpui-journal.png
            dist/gpui-journal-calendar.png
            dist/gpui-journal-read.png
          if-no-files-found: error

      - name: Upload page screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: gpui-page-screenshots
          path: |
            dist/gpui-page.png
            dist/gpui-page-note-menu.png
            dist/gpui-page-read.png
            dist/gpui-page-cards.png
            dist/gpui-page-highlight.png
            dist/gpui-page-snippet.png
          if-no-files-found: error

      - name: Upload search screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: gpui-search-screenshots
          path: |
            dist/gpui-search.png
            dist/gpui-search-tag.png
          if-no-files-found: error

      - name: Upload query screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: gpui-query-screenshots
          path: |
            dist/gpui-query.png
            dist/gpui-query-results.png
            dist/gpui-query-datalog.png
          if-no-files-found: error

      - name: Upload ask notes screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: gpui-ask-screenshots
          path: |
            dist/gpui-ask.png
          if-no-files-found: error

      - name: Upload templates screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: gpui-templates-screenshots
          path: |
            dist/gpui-templates.png
          if-no-files-found: error

      - name: Upload flashcards screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: gpui-flashcards-screenshots
          path: |
            dist/gpui-flashcards.png
            dist/gpui-flashcards-answer.png
          if-no-files-found: error

      - name: Upload reminders screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: gpui-reminders-screenshots
          path: |
            dist/gpui-reminders.png
            dist/gpui-reminders-dialog.png
            dist/gpui-reminder-toast.png
          if-no-files-found: error

      - name: Upload plugins screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: gpui-plugins-screenshots
          path: |
            dist/gpui-plugins.png
            dist/gpui-plugins-directory.png
            dist/gpui-plugins-themes.png
          if-no-files-found: error

      - name: Upload editor performance report
        uses: actions/upload-artifact@v4
        with:
          name: gpui-editor-perf
          path: .hermes/perf/editor-10k-frames.json
          if-no-files-found: error

      - name: Upload mobile screenshots artifact
        uses: actions/upload-artifact@v4
        with:
          name: gpui-mobile-screenshots
          path: dist/gpui-mobile-*.png
          if-no-files-found: error

  gpui-android:
    name: gpui android host (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt
          cache: false

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Add Android targets
        run: rustup target add aarch64-linux-android x86_64-linux-android

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        shell: bash
        run: |
          if [ -d /usr/local/lib/android/sdk ]; then
            echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
            echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          fi
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager -type f 2>/dev/null | head -1 || true)
          if [ -z "$SDKMANAGER" ]; then SDKMANAGER=$(command -v sdkmanager || true); fi
          if [ -n "$SDKMANAGER" ]; then
            echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
            yes | "$SDKMANAGER" --licenses >/dev/null || true
          fi

      - name: Install NDK
        run: |
          for NDK_VER in "27.1.12297006" "27.0.12077973"; do
            if sdkmanager --install "ndk;${NDK_VER}" 2>/dev/null; then
              NDK_PATH="$ANDROID_HOME/ndk/${NDK_VER}"
              break
            fi
          done
          : "${NDK_PATH:=$ANDROID_HOME/ndk/27.1.12297006}"
          if [ ! -d "$NDK_PATH" ]; then
            NDK_PATH=$(ls -d $ANDROID_HOME/ndk/* 2>/dev/null | sort -V | tail -1)
          fi
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk@4.1.2

      - name: Install Linux dependencies
        uses: ./.github/actions/install-linux-deps

      - name: Install frontend dependencies
        run: npm ci

      - name: Build the Android APK
        run: ./scripts/build-android.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: stratum-android-apk
          path: crates/stratum-mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
