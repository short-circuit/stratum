name: CI + Release

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:
  schedule:
    # Weekly drift check: runs the real tauri-driver E2E against the latest
    # commit on the default branch so dependency / runner-image / WebKit
    # drift cannot silently break the real-E2E layer between PRs.
    - cron: '0 3 * * 1'   # every Monday 03:00 UTC

env:
  CARGO_TERM_COLOR: always
  WEBKIT_DISABLE_DMABUF_RENDERER: 1
  WEBKIT_DISABLE_COMPOSITING_MODE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── CI (runs on every push/PR) ─────────────────────────────────────
  test:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt
          cache: false

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux dependencies
        uses: ./.github/actions/install-linux-deps

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run tests
        run: cargo test --workspace

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run linter
        run: npm run lint

      - name: Install Playwright
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        run: npm run test:e2e

  # ── Frontend unit tests (required for PR merge) ──────────────────
  frontend-test:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend unit tests
        run: npm test

  # ── tauri-driver E2E harness (automatic on push/PR; required after merge;
  #    weekly on schedule / manual via workflow_dispatch) ──
  e2e-harness:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # WebKitGTK >= 2.44 forces a bubblewrap sandbox that crashes the web
      # process on containerized runners; disabling it is required for
      # WebDriver tests in CI (the harness sets this internally too).
      # WEBKIT_FORCE_SANDBOX=0 is deprecated and no longer works.
      WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt
          cache: false

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux dependencies (webkit, gtk, webkit2gtk-driver, xvfb)
        uses: ./.github/actions/install-linux-deps

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app (production / custom-protocol)
        run: |
          npm run build
          cargo build -p stratum-tauri

      - name: Install tauri-driver
        run: cargo install tauri-driver

      - name: Run E2E harness
        run: dbus-run-session -- npm run test:e2e:harness

      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-harness-artifacts
          path: |
            test-results/*
            target/debug/stratum-tauri
            /tmp/stratum-harness-last.png
          if-no-files-found: warn
          retention-days: 7

  # ── Frontend build (tag only, decoupled from test for parallelism) ──
  frontend:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux dependencies
        uses: ./.github/actions/install-linux-deps

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Upload frontend build for release
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 1

  # ── Desktop builds (tag only) ──────────────────────────────────────
  desktop:
    needs: [frontend]
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: linux-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: windows-x86_64

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          cache: false

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/install-linux-deps

      - name: Install frontend dependencies
        run: npm ci

      - name: Download pre-built frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist/

      - name: Install Perl (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install strawberryperl --no-progress -y 2>$null
          $perl = Get-Command perl.exe -ErrorAction SilentlyContinue | Select -ExpandProperty Source
          if (-not $perl) { $perl = "C:\Strawberry\perl\bin\perl.exe" }
          echo "PERL=$perl" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "OPENSSL_SRC_PERL=$perl" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build Tauri app
        shell: bash
        run: |
          set -o pipefail
          TMP="${RUNNER_TEMP//\\//}"
          if [ "${{ runner.os }}" = "Linux" ]; then
            APPIMAGE_EXTRACT_AND_RUN=1 npx tauri build --bundles appimage 2>&1 | tee "$TMP/tauri-build.log"
          elif [ "${{ runner.os }}" = "macOS" ]; then
            APPLE_SIGNING_IDENTITY="${APPLE_SIGNING_IDENTITY:--}" npx tauri build --bundles app 2>&1 | tee "$TMP/tauri-build.log"
          elif [ "${{ runner.os }}" = "Windows" ]; then
            RUSTFLAGS="" npx tauri build --no-bundle 2>&1 | tee "$TMP/tauri-build.log"
          fi
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Zip macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd target/release/bundle/macos
          APP_NAME=$(ls -d *.app | head -1)
          if [ -n "$APP_NAME" ]; then
            ditto -c -k --keepParent "$APP_NAME" "${APP_NAME%.app}.zip"
          fi

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/macos/*.zip
            target/release/stratum-tauri.exe
          if-no-files-found: warn
          retention-days: 7

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-log
          path: ${{ runner.temp }}/tauri-build.log
          if-no-files-found: warn

  # ── Android build (PR / push to master / tag) ─────────────────────
  # Runs on pull requests and pushes to master as an installable CI gate
  # (debug APK) and on v* tags to produce the release APK + AAB signed
  # with the release keystore from CI secrets. The frontend is built
  # inline by `tauri android build` (beforeBuildCommand runs `npm run
  # build`), so this job has no dependency on the tag-only `frontend` job
  # and can run on any trigger.
  android:
    if: github.event_name == 'pull_request' || github.event_name == 'push' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Add Android targets
        run: |
          rustup target add \
            aarch64-linux-android \
            armv7-linux-androideabi \
            x86_64-linux-android \
            i686-linux-android

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        shell: bash
        run: |
          # GitHub-hosted runners ship a preinstalled Android SDK; setup-android@v3
          # intermittently hangs on interactive sdkmanager --licenses (6/7 licenses
          # unaccepted, waits on y/N in a no-TTY context). Set the env explicitly and
          # accept every license non-interactively so the NDK step below is reliable.
          if [ -d /usr/local/lib/android/sdk ]; then
            echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
            echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          fi
          # Locate sdkmanager from the preinstalled cmdline-tools
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager -type f 2>/dev/null | head -1 || true)
          if [ -z "$SDKMANAGER" ]; then SDKMANAGER=$(command -v sdkmanager || true); fi
          if [ -n "$SDKMANAGER" ]; then
            # Expose sdkmanager's directory so subsequent steps (Install NDK)
            # can call it on PATH without setup-android@v3.
            echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
            # Random tips count as progress; leftover license groups of the
            # form '^[0-9]+/.*License' would otherwise stall waiting on input.
            yes | "$SDKMANAGER" --licenses >/dev/null || true
          fi

      - name: Install NDK
        run: |
          # Try NDK 27.1 first (our local pinned version), fall back to 27.0
          for NDK_VER in "27.1.12297006" "27.0.12077973"; do
            if sdkmanager --install "ndk;${NDK_VER}" 2>/dev/null; then
              NDK_PATH="$ANDROID_HOME/ndk/${NDK_VER}"
              break
            fi
          done
          : "${NDK_PATH:=$ANDROID_HOME/ndk/27.1.12297006}"
          if [ ! -d "$NDK_PATH" ]; then
            echo "::warning::NDK not installed, trying fallback"
            NDK_PATH=$(ls -d $ANDROID_HOME/ndk/* 2>/dev/null | sort -V | tail -1)
          fi
          TOOLCHAIN="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "CC_aarch64_linux_android=$TOOLCHAIN/bin/aarch64-linux-android21-clang" >> $GITHUB_ENV
          echo "AR_aarch64_linux_android=$TOOLCHAIN/bin/llvm-ar" >> $GITHUB_ENV
          echo "RANLIB_aarch64_linux_android=$TOOLCHAIN/bin/llvm-ranlib" >> $GITHUB_ENV
          echo "CC_armv7_linux_androideabi=$TOOLCHAIN/bin/armv7a-linux-androideabi21-clang" >> $GITHUB_ENV
          echo "AR_armv7_linux_androideabi=$TOOLCHAIN/bin/llvm-ar" >> $GITHUB_ENV
          echo "RANLIB_armv7_linux_androideabi=$TOOLCHAIN/bin/llvm-ranlib" >> $GITHUB_ENV
          echo "CC_x86_64_linux_android=$TOOLCHAIN/bin/x86_64-linux-android21-clang" >> $GITHUB_ENV
          echo "AR_x86_64_linux_android=$TOOLCHAIN/bin/llvm-ar" >> $GITHUB_ENV
          echo "RANLIB_x86_64_linux_android=$TOOLCHAIN/bin/llvm-ranlib" >> $GITHUB_ENV
          echo "CC_i686_linux_android=$TOOLCHAIN/bin/i686-linux-android21-clang" >> $GITHUB_ENV
          echo "AR_i686_linux_android=$TOOLCHAIN/bin/llvm-ar" >> $GITHUB_ENV
          echo "RANLIB_i686_linux_android=$TOOLCHAIN/bin/llvm-ranlib" >> $GITHUB_ENV

      - name: Install Linux dependencies
        uses: ./.github/actions/install-linux-deps

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Release signing (tags): the keystore is stored in CI secrets as a
          # base64-encoded keystore file. Decode it to a temp path and export
          # the signing config env for the Gradle build below. If no secrets
          # are set (e.g. PRs from forks), fall back to the checked-in debug
          # keystore so the build is still a valid CI gate. Release (tag)
          # builds define the secrets, so release artifacts are always signed
          # with the production keystore.
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "::notice::Using release keystore from CI secrets for signing"
          else
            echo "::notice::No ANDROID_KEYSTORE secret set; falling back to debug keystore"
            echo "ANDROID_KEYSTORE=debug.keystore" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=android" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=stratum-debug" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=android" >> "$GITHUB_ENV"
          fi

      - name: Initialize Android project
        run: npx tauri android init

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            src-tauri/gen/android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/gradle.properties') }}

      - name: Apply Android patches
        run: |
          cp -r src-tauri/android-patches/app/src/main/* src-tauri/gen/android/app/src/main/
          # Override generated build.gradle.kts with patched version (signing config, etc.)
          cp src-tauri/android-patches/app/build.gradle.kts src-tauri/gen/android/app/build.gradle.kts
          # Copy proguard rules for Tauri WebView bridge
          cp src-tauri/android-patches/app/proguard-rules.pro src-tauri/gen/android/app/proguard-rules.pro 2>/dev/null || true
          # Copy checked-in debug keystore for APK signing
          cp src-tauri/android-patches/debug.keystore src-tauri/gen/android/app/debug.keystore

      - name: Build Android release APK + AAB (tags)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npx tauri android build --target aarch64 --apk --aab 2>&1 | tee ${{ runner.temp }}/tauri-build.log; exit ${PIPESTATUS[0]}

      # Debug builds do not need the release keystore (Gradle signs the debug
      # APK with the debug signing config automatically) and are cheap enough
      # to run on every PR/push as a CI gate. The uploaded debug APK is also
      # the installable artifact a separate smoke-test job consumes — the
      # smoke job boots an x86_64 emulator, so the debug APK must ship the
      # x86_64 ABI alongside arm64 (without it the emulator refuses to
      # install with INSTALL_FAILED_NO_MATCHING_ABIS). The NDK cross-compile
      # env vars for both ABIs are exported by the Install NDK step above.
      # A v* tag push is itself a `push` event, so exclude tag refs here to
      # preserve the tag-triggered release build (above) as the only build on
      # releases.
      - name: Build Android debug APK (PRs / pushes)
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/'))
        shell: bash
        run: npx tauri android build --debug --target aarch64 x86_64 --apk 2>&1 | tee ${{ runner.temp }}/tauri-build.log; exit ${PIPESTATUS[0]}

      - name: Upload Android release artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            src-tauri/gen/android/**/*.apk
            src-tauri/gen/android/**/*.aab
          if-no-files-found: error
          retention-days: 7

      - name: Upload Android debug APK
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/'))
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: src-tauri/gen/android/**/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-log
          path: ${{ runner.temp }}/tauri-build.log
          if-no-files-found: warn

  # ── iOS build (PR / push to master / tag) ─────────────────────────
  # Builds the iOS app for the simulator (aarch64-apple-ios-sim). Simulator
  # builds require no Apple signing certificate or provisioning profile, so
  # this runs on pull requests and pushes to master as an installable CI
  # gate (debug build, uploaded as `ios-sim-app`) and on v* tags to produce
  # the release simulator build (uploaded as `ios`). The frontend is built
  # inline by `tauri ios build` (beforeBuildCommand runs `npm run build`),
  # so this job has no dependency on the tag-only `frontend` artifact and
  # can run on any trigger.
  # ── Android on-device smoke test (PRs / pushes to master) ──────────────
  # Boots an emulator, installs the debug APK produced by the `android` job,
  # launches the app, waits for the first rendered frame and captures a
  # screenshot + logcat as reviewable evidence that the app actually starts.
  # `needs: [android]` + concurrency cancel-in-progress gives fail-fast: if the
  # app crashes or never reaches a first frame the job (and therefore the PR)
  # is red. Runs only on the same non-tag triggers that produce the debug APK;
  # release (tag) builds carry their own signed artifacts and keep a checkout-
  # free, minimal tag pipeline.
  android-smoke:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/'))
    needs: [android]
    runs-on: ubuntu-latest
    # First boot downloads the API-34 system image + emulator (~2 GB), so leave
    # generous headroom over the ~10 min the smoke script itself can take.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # Pin node 22 (matches every other job in this workflow). The safe-area
      # probe prefers the WHATWG WebSocket global (node >= 22) and only falls
      # back to the `ws` package when one exists (it does NOT here: this job
      # never runs npm install, so node_modules is absent in the checkout).
      # Pinning node 22 is therefore what makes the android-smoke gate runnable
      # in CI, not a convenience.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: android-debug-apk
          path: android-debug-apk

      - name: Run on-device smoke test
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          # API 34 + x86_64 keeps the run on a fast, stable, hardware-
          # accelerated system image; minSdk is 24 so nothing here is above
          # the image. The emulator runner provisions its own SDK under
          # $ANDROID_HOME and accepts all licenses non-interactively, which
          # supersedes the runner's preinstalled SDK for this job.
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          # No skinned boot (headless CI). GitHub-hosted Linux runners do NOT
          # expose a working /dev/kvm to the runner user, so `disable-linux-hw-accel`
          # auto-detects software emulation (`-accel off`); the smoke script is
          # deliberately robust to that (see smoke-android.sh header). The
          # emulator still boots an x86_64 image under swiftshader rendering.
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          # The action wraps this in `sh -c` (dash) where `set -euo pipefail`
          # is illegal — so keep it to a plain bash invocation; the script sets
          # its own strict options and fails the job on any crash/timeout.
          script: |
            bash .github/scripts/smoke-android.sh
        env:
          # Debug APK download location; harvested evidence is always archived.
          APK_DIR: android-debug-apk
          CI_HARVEST_DIR: android-smoke-evidence

      - name: Upload smoke-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke-evidence
          path: android-smoke-evidence/
          if-no-files-found: warn
          retention-days: 14

  ios:
    needs: [test]
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Add iOS targets
        run: |
          rustup target add \
            aarch64-apple-ios \
            aarch64-apple-ios-sim \
            x86_64-apple-ios

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Initialize iOS project
        run: |
          if [ ! -d "src-tauri/gen/apple" ]; then
            npx tauri ios init
          fi

      - name: Patch Xcode project (link flags for old SDKs)
        shell: bash
        run: |
          PBXPROJ=$(find src-tauri/gen/apple -name project.pbxproj -path '*.xcodeproj/*' 2>/dev/null | head -1)
          if [ -z "$PBXPROJ" ]; then
            echo "::warning::No generated Xcode project found under src-tauri/gen/apple; skipping link-flag patch"
          else
            python3 -c "import sys;c=open(sys.argv[1]).read();c=c.replace('VALID_ARCHS = arm64;','VALID_ARCHS = arm64;\n\t\t\t\tOTHER_LDFLAGS = \"-lz -liconv\";');open(sys.argv[1],'w').write(c)" "$PBXPROJ"
          fi

      - name: Build iOS simulator app (debug; PRs / pushes)
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/'))
        shell: bash
        run: npx tauri ios build --debug --target aarch64-sim --ci 2>&1 | tee ${{ runner.temp }}/tauri-build.log; exit ${PIPESTATUS[0]}
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Build iOS simulator app (release; tags)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npx tauri ios build --target aarch64-sim --ci 2>&1 | tee ${{ runner.temp }}/tauri-build.log; exit ${PIPESTATUS[0]}
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Zip iOS simulator app
        shell: bash
        run: |
          if [ -d src-tauri/gen/apple/build ]; then
            cd src-tauri/gen/apple/build
            APP_PATH=$(find . -name "*.app" -maxdepth 3 | head -1)
            if [ -n "$APP_PATH" ]; then
              APP_NAME=$(basename "$APP_PATH")
              ditto -c -k --keepParent "$APP_PATH" "${APP_NAME%.app}.zip"
            fi
          fi

      - name: Upload iOS simulator app (PRs / pushes)
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/'))
        uses: actions/upload-artifact@v4
        with:
          name: ios-sim-app
          path: src-tauri/gen/apple/build/**/*.zip
          if-no-files-found: warn
          retention-days: 7

      - name: Upload iOS artifact (tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: ios
          path: src-tauri/gen/apple/build/**/*.zip
          if-no-files-found: warn
          retention-days: 7

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-log
          path: ${{ runner.temp }}/tauri-build.log
          if-no-files-found: warn

  # ── GitHub Release (tag only, after all builds) ────────────────────
  release:
    needs: [desktop, android]
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') && (needs.desktop.result == 'success' || needs.android.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Stage release assets
        shell: bash
        run: |
          mkdir -p assets

          APPIMAGE=$(find linux-x86_64 -name '*.AppImage' -type f 2>/dev/null | head -1)
          if [ -n "$APPIMAGE" ]; then
            cp "$APPIMAGE" assets/stratum-pkm-linux.AppImage
          fi

          MACOS_ZIP=$(find macos-x86_64 -name '*.zip' -type f 2>/dev/null | head -1)
          if [ -n "$MACOS_ZIP" ]; then
            cp "$MACOS_ZIP" assets/stratum-pkm-macos.zip
          fi

          if [ -f windows-x86_64/stratum-tauri.exe ]; then
            cp windows-x86_64/stratum-tauri.exe assets/stratum-pkm-windows.exe
          fi

          APK=$(find android -name '*.apk' -type f 2>/dev/null | head -1)
          if [ -n "$APK" ]; then
            cp "$APK" assets/stratum-pkm-android.apk
          fi

          AAB=$(find android -name '*.aab' -type f 2>/dev/null | head -1)
          if [ -n "$AAB" ]; then
            cp "$AAB" assets/stratum-pkm-android.aab
          fi

          ls -la assets/

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          draft: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
