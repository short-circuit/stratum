name: CI

# Single CI pipeline for the native Stratum shell.
#
# The React/Tauri frontend was deleted at the E12 cutover, so this workflow
# guards the one shipped application: the Rust workspace, the gpui shell, the
# Android host and the parity harness. Release packaging lives in
# `gpui-release.yml` (deb/rpm/AppImage/MSI/NSIS/macOS/APK/AAB).
#
# Gates:
#   repo-hygiene   no transient agent artifacts are tracked
#   test           workspace fmt/clippy/test (Linux)
#   shell          shell crates build/test/clippy on Windows and macOS
#   parity         golden screenshots, perf budgets and the accessibility probe
#   android        debug APK via scripts/build-android.sh
#   android-smoke  the APK installs and reaches a first frame on an emulator
#   mcp-coverage   pkm-mcp line coverage >= 80%
#   security-audit cargo audit against the pinned baseline

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # gpui renders through software Vulkan on headless runners.
  LIBGL_ALWAYS_SOFTWARE: '1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Repo hygiene (no deps, fast) ─────────────────────────────────
  # Fails if a transient agent artifact (plan/QA report/evidence/…) is
  # tracked. Prevents the .hermes/-outside-the-ignored-dirs recurrence.
  repo-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tracked transient artifacts
        run: ./scripts/check-transient-artifacts.sh

  # ── Workspace gate (Linux) ───────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt
          cache: false

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        uses: ./.github/actions/install-linux-deps

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: RUSTFLAGS=-D warnings cargo test --workspace

  # ── Cross-platform shell gate ────────────────────────────────────
  # The shell ships on Windows and macOS too, so those hosts must compile and
  # test the platform-independent crates; the shell binary is built as well
  # because gpui's platform layer differs per OS.
  shell:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt
          cache: false

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build the shell
        run: cargo build -p stratum-ui -p stratum-mobile

      - name: Run shell tests
        run: cargo test -p stratum-i18n -p stratum-ui -p stratum-editor

      - name: Run shell clippy
        run: cargo clippy -p stratum-i18n -p stratum-ui -p stratum-editor --all-targets -- -D warnings

  # ── Parity harness (goldens, perf, a11y) ─────────────────────────
  # The E12 acceptance gate: every shipped surface is captured at the plan's
  # reference sizes and diffed against the committed goldens, the perf budgets
  # are measured, and the AccessKit tree is audited for unnamed controls and
  # leaked catalog keys. Reports are uploaded as artifacts.
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Cross-runner font/AA drift is larger than the 2% local budget; the
      # committed goldens are generated on the release host at 0.02.
      GOLDEN_TOLERANCE: '0.05'
      CAPTURE_DISPLAY: '95'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        uses: ./.github/actions/install-linux-deps

      - name: Install capture and probe dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            imagemagick \
            xdotool \
            xvfb \
            at-spi2-core \
            dbus

      - name: Golden-screenshot parity
        run: ./scripts/verify-gpui-goldens.sh

      - name: Performance budgets
        run: ./scripts/verify-gpui-perf.sh

      - name: Accessibility probe
        run: dbus-run-session -- ./scripts/verify-gpui-a11y.sh

      - name: Upload parity reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpui-parity
          path: |
            .hermes/parity/
            .hermes/a11y/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload rendered surfaces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpui-surfaces
          path: |
            .hermes/parity/captures/*.png
            dist/gpui-*.png
          if-no-files-found: warn
          retention-days: 14

  # ── Android build ────────────────────────────────────────────────
  # scripts/build-android.sh cross-compiles libstratum_mobile.so for arm64-v8a
  # and x86_64 and packages the debug APK. The x86_64 ABI is what the emulator
  # smoke job installs.
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Add Android targets
        run: rustup target add aarch64-linux-android x86_64-linux-android

      - name: Install Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        shell: bash
        run: |
          if [ -d /usr/local/lib/android/sdk ]; then
            echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
            echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          fi
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager -type f 2>/dev/null | head -1 || true)
          if [ -z "$SDKMANAGER" ]; then SDKMANAGER=$(command -v sdkmanager || true); fi
          if [ -n "$SDKMANAGER" ]; then
            echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
            yes | "$SDKMANAGER" --licenses >/dev/null || true
          fi

      - name: Install NDK
        run: |
          for NDK_VER in "27.1.12297006" "27.0.12077973"; do
            if sdkmanager --install "ndk;${NDK_VER}" 2>/dev/null; then
              NDK_PATH="$ANDROID_HOME/ndk/${NDK_VER}"
              break
            fi
          done
          : "${NDK_PATH:=$ANDROID_HOME/ndk/27.1.12297006}"
          if [ ! -d "$NDK_PATH" ]; then
            NDK_PATH=$(ls -d $ANDROID_HOME/ndk/* 2>/dev/null | sort -V | tail -1)
          fi
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk@4.1.2

      - name: Install Linux dependencies
        uses: ./.github/actions/install-linux-deps

      - name: Build the Android APK
        run: ./scripts/build-android.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: stratum-android-apk
          path: crates/stratum-mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  # ── Android on-device smoke test ─────────────────────────────────
  # Boots an emulator, installs the debug APK produced by the `android` job,
  # launches the app, waits for the first rendered frame and captures a
  # screenshot + logcat as reviewable evidence. `needs: [android]` +
  # cancel-in-progress gives fail-fast: if the app crashes or never reaches a
  # first frame the job (and therefore the PR) is red.
  android-smoke:
    needs: [android]
    runs-on: ubuntu-latest
    # First boot downloads the API-34 system image + emulator (~2 GB), so leave
    # generous headroom over the ~10 min the smoke script itself can take.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Download debug APK
        uses: actions/download-artifact@v8
        with:
          name: stratum-android-apk
          path: android-debug-apk

      - name: Run on-device smoke test
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          # API 34 + x86_64 keeps the run on a fast, stable, hardware-
          # accelerated system image; minSdk is 26 so nothing here is above
          # the image. The emulator runner provisions its own SDK under
          # $ANDROID_HOME and accepts all licenses non-interactively.
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          # GitHub-hosted Linux runners do NOT expose a working /dev/kvm to the
          # runner user, so software emulation is used; the smoke script is
          # deliberately robust to that (see smoke-android.sh header).
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          # The action wraps this in `sh -c` (dash) where `set -euo pipefail`
          # is illegal — so keep it to a plain bash invocation; the script sets
          # its own strict options and fails the job on any crash/timeout.
          script: |
            bash .github/scripts/smoke-android.sh
        env:
          # Debug APK download location; harvested evidence is always archived.
          APK_DIR: android-debug-apk
          CI_HARVEST_DIR: android-smoke-evidence

      - name: Upload smoke-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke-evidence
          path: android-smoke-evidence/
          if-no-files-found: warn
          retention-days: 14

  # ── MCP server coverage gate ─────────────────────────────────────
  # Enforces >=80% line coverage of the MCP server crate. Runs the pkm-mcp
  # suites under -Cinstrument-coverage using the rustup llvm-tools (no external
  # crates) and fails if the MCP crates' line coverage drops below the
  # threshold.
  mcp-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (+ llvm-tools for coverage)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: llvm-tools-preview
          cache: false

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies (rusqlite build)
        uses: ./.github/actions/install-linux-deps

      - name: Run MCP coverage gate (>=80%)
        run: bash scripts/mcp-coverage-gate.sh

  # ── Supply-chain security gate ───────────────────────────────────
  security-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Rust supply-chain audit (blocks on NEW advisories)
        # .cargo/audit.toml pins the accepted workspace baseline
        # (wasmtime/unic-* chains). Any advisory not in that list fails this
        # step, so new vulnerabilities are caught in CI.
        run: cargo audit
