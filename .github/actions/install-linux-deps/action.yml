name: Install Linux dependencies
description: Install system packages required to build and capture the native GPUI shell on Linux (X11/Wayland, xkbcommon, fontconfig, Vulkan/EGL, GTK for the tray indicator, ALSA, Xvfb)

runs:
  using: composite
  steps:
    - name: Install system packages
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libgtk-3-dev \
          librsvg2-dev \
          libssl-dev \
          libasound2-dev \
          pkg-config \
          rpm \
          xvfb \
          dbus \
          libayatana-appindicator3-dev \
          libwayland-dev \
          libxkbcommon-dev \
          libxkbcommon-x11-dev \
          libfontconfig1-dev \
          libfreetype6-dev \
          libx11-dev \
          libxcb1-dev \
          libvulkan-dev \
          libegl1-mesa-dev \
          libgl1-mesa-dev
