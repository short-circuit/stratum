name: Install Linux dependencies
description: Install system packages required for Tauri builds on Linux (webkit, gtk, openssl, etc.), the headless WebDriver stack (webkit2gtk-driver, xvfb) and the native GPUI shell (wayland, xkbcommon, fontconfig, Vulkan/EGL)

runs:
  using: composite
  steps:
    - name: Install system packages
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libwebkit2gtk-4.1-dev \
          libgtk-3-dev \
          libsoup-3.0-dev \
          libjavascriptcoregtk-4.1-dev \
          librsvg2-dev \
          libssl-dev \
          libasound2-dev \
          pkg-config \
          rpm \
          webkit2gtk-driver \
          xvfb \
          dbus \
          libayatana-appindicator3-dev \
          libwayland-dev \
          libxkbcommon-dev \
          libfontconfig1-dev \
          libfreetype6-dev \
          libx11-dev \
          libxcb1-dev \
          libvulkan-dev \
          libegl1-mesa-dev \
          libgl1-mesa-dev
