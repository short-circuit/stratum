[package]
name = "stratum-canvas"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Excalidraw-compatible whiteboard document model, tools and .excalidraw round-trip"

[lib]
name = "stratum_canvas"
path = "src/lib.rs"

[dependencies]
pkm-core = { path = "../pkm-core" }
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
uuid.workspace = true
log.workspace = true

# Rendering. Every dependency below is AGPL-3.0 compatible: roughr (MIT),
# palette (MIT OR Apache-2.0), resvg (MPL-2.0), tiny-skia (BSD-3-Clause),
# image-webp (MIT OR Apache-2.0) and image (MIT OR Apache-2.0, dev only).
roughr = "0.14"
palette = "0.7"
resvg = { version = "0.46", default-features = false, features = ["text", "raster-images"] }
tiny-skia = "0.11"
image-webp = "0.2"

[dev-dependencies]
tempfile.workspace = true
pretty_assertions.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
