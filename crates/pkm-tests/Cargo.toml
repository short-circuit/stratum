[package]
name = "pkm-tests"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Integration tests for the Stratum PKM Rust crates"

[lib]
name = "pkm_tests"
path = "src/lib.rs"

[dependencies]
pkm-core = { path = "../pkm-core" }
pkm-block = { path = "../pkm-block" }
pkm-markdown = { path = "../pkm-markdown" }
pkm-index = { path = "../pkm-index" }
pkm-sync = { path = "../pkm-sync" }
pkm-query = { path = "../pkm-query" }
pkm-ai = { path = "../pkm-ai" }
pkm-plugin = { path = "../pkm-plugin" }
# The headless service layer behind the shipped commands (the integration
# tests drive the export, journal and plugin paths through it directly).
# See crates/pkm-tests/tests/{export_output,journal_db_drift_regression,
# plugin_e2e,plugin_example_e2e}.rs.
stratum-app = { path = "../stratum-app" }
tempfile.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
tokio.workspace = true

[dev-dependencies]
wiremock = "0.6"
wat.workspace = true

