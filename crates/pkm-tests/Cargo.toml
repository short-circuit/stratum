[package]
name = "pkm-tests"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Integration tests for the Stratum PKM Rust crates"

[lib]
name = "pkm_tests"
path = "src/lib.rs"

[dependencies]
pkm-core = { path = "../pkm-core" }
pkm-block = { path = "../pkm-block" }
pkm-markdown = { path = "../pkm-markdown" }
pkm-index = { path = "../pkm-index" }
pkm-sync = { path = "../pkm-sync" }
pkm-query = { path = "../pkm-query" }
pkm-ai = { path = "../pkm-ai" }
pkm-plugin = { path = "../pkm-plugin" }
# The Tauri command layer (PluginManager + command handlers). Pulled in so the
# plugin E2E suite can drive the same manager the Tauri commands delegate to.
stratum-tauri = { path = "../../src-tauri" }
tempfile.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
tokio.workspace = true
pulldown-cmark = { workspace = true }
pretty_assertions = { workspace = true }

[dev-dependencies]
wiremock = "0.6"
wat.workspace = true

