[package]
name = "pkm-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MCP server exposing the Stratum knowledge base to external AI clients"

[[bin]]
name = "pkm-mcp"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
thiserror.workspace = true
anyhow.workspace = true
chrono.workspace = true
uuid.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rmcp.workspace = true
jsonschema.workspace = true
axum.workspace = true
hyper.workspace = true
hyper-util.workspace = true
tower-service.workspace = true
http-body-util.workspace = true
clap.workspace = true
sha2 = { version = "0.10", features = ["oid"] }
base64.workspace = true
regex.workspace = true

pkm-core = { path = "../pkm-core" }
pkm-block = { path = "../pkm-block" }
pkm-markdown = { path = "../pkm-markdown" }
pkm-index = { path = "../pkm-index" }
pkm-query = { path = "../pkm-query" }

[dev-dependencies]
tempfile.workspace = true
