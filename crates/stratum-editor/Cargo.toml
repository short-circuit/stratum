[package]
name = "stratum-editor"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Headless block-editor engine: document model, inline spans, editing state, undo, menus (no UI dependencies)"

[lib]
name = "stratum_editor"
path = "src/lib.rs"

[dependencies]
pkm-core = { path = "../pkm-core" }
pkm-block = { path = "../pkm-block" }
pkm-markdown = { path = "../pkm-markdown" }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
regex.workspace = true
ratex-parser = "0.1.15"
ratex-layout = "0.1.15"
ratex-render = { version = "0.1.15", features = ["embed-fonts"] }
ratex-types = "0.1.15"
mermaid-rs-renderer = { version = "0.3.1", default-features = false }

[dev-dependencies]
tempfile.workspace = true
