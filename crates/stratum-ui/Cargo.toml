[package]
name = "stratum-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Stratum gpui shell: the desktop UI on top of the headless service layer"

[[bin]]
name = "stratum"
path = "src/main.rs"

[lib]
name = "stratum_ui"
path = "src/lib.rs"

[dependencies]
gpui-kit = { version = "0.9", default-features = false, features = ["component", "assets"] }
stratum-i18n = { path = "../stratum-i18n" }
stratum-app = { path = "../stratum-app" }
pkm-core = { path = "../pkm-core" }
rust-embed = "8"
serde.workspace = true
serde_json.workspace = true
log.workspace = true
tokio.workspace = true

[dev-dependencies]
tempfile.workspace = true
