pkm-watcher = { path = "../pkm-watcher" }
pkm-audio = { path = "../pkm-audio" }
pkm-stt = { path = "../pkm-stt" }
pkm-query = { path = "../pkm-query" }
pkm-plugin = { path = "../pkm-plugin" }
pkm-ai = { path = "../pkm-ai" }
pkm-dictation = { path = "../pkm-dictation" }
pulldown-cmark.workspace = true
zip.workspace = true
latex2mathml.workspace = true
gix.workspace = true
serde.workspace = true
