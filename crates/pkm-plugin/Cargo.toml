[package]
name = "pkm-plugin"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
wasmtime.workspace = true
# Real WASI preview1 support for `std` wasm32-wasi plugin builds (fd_write,
# environ_get, proc_exit, random_get, clocks). Replaces the old no-op stub so
# genuine `wasm32-wasip1` artifacts instantiate with their real import
# signatures (contract §7.1 — see docs/advanced/plugins.md).
wasmtime-wasi.workspace = true
anyhow.workspace = true
pkm-core = { path = "../pkm-core" }

# Host backend for the plugin runtime: real note I/O (filesystem) + HTTP with
# SSRF guard, timeouts, and async dispatch (contract §4, ADR-0004 §12).
reqwest.workspace = true
url.workspace = true
tokio.workspace = true
async-trait = "0.1"
ipnet = "2"
chrono.workspace = true

[dev-dependencies]
tempfile.workspace = true
