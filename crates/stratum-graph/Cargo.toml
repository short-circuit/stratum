[package]
name = "stratum-graph"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Deterministic d3-force-3d graph physics, camera parity and headless wgpu 3D renderer"

[lib]
name = "stratum_graph"
path = "src/lib.rs"

[dependencies]
pkm-core = { path = "../pkm-core" }
wgpu = "30"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.2"
rayon = "1"
ab_glyph = "0.2"
log.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
tempfile.workspace = true

[[bin]]
name = "graph_golden"
path = "src/bin/graph_golden.rs"
