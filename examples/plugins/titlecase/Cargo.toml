# The example is intentionally a standalone crate (not a workspace member):
# it must build on a user's machine with a single `cargo build --target
# wasm32-wasip1`, without depending on the Stratum workspace.
[workspace]

[package]
name = "stratum-plugin-titlecase"
version = "0.1.0"
edition = "2021"
description = "Example Stratum plugin: title-case note content on save."

# A plugin is a cdylib — hooks are exported as plain (`i32, i32`) -> i32
# functions (the host ABI), there is no Rust entry point.
[lib]
crate-type = ["cdylib"]

[dependencies]
# serde_json is the only runtime dependency the example needs: the host
# delivers hook payloads and reads responses as UTF-8 JSON strings.
serde_json = "1"

[profile.release]
# Keep the shipped .wasm small and deterministic. `wasm32-wasip1` payloads
# this size copy into a vault in milliseconds.
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
